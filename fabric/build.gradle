plugins {
    id 'java'
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

group = rootProject.group
version = rootProject.version

base {
    // Loader-specific names make the two release assets unambiguous when both
    // are attached to the same GitHub release.
    archivesName = 'mineagent-fabric'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
}

// Add api, engine and tools source directories to the main source set
// This way Loom compiles them with proper MC mappings, and the final jar
// contains all required classes (api module is needed at runtime).
sourceSets {
    main {
        java {
            srcDir project(':api').file('src/main/java')
            srcDir project(':engine').file('src/main/java')
            // Shared vanilla client UI is compiled only into loader JARs.
            // Keeping it outside engine/main prevents dedicated-server class
            // loading while giving Fabric and NeoForge one visual codebase.
            srcDir project(':engine').file('src/client/java')
            srcDir project(':tools').file('src/main/java')
            // SMH plan 70: AltoClef's tasks while they are ported (engine/.../alto); compiled only with -Palto
            // (.github/workflows/alto-compile.yml) until they build, then always.
            if (!project.hasProperty('alto')) exclude 'com/mineagent/engine/alto/**'
        }
        resources {
            srcDir project(':engine').file('src/client/resources')
            srcDir project(':tools').file('src/main/resources')
        }
    }
    // Game tests (SMH plan 69, MA4.4): a separate test mod, run on a headless server by runGametest; never in the jar.
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

dependencies {
    // Minecraft + Fabric
    minecraft "com.mojang:minecraft:${project.property('minecraft_version')}"
    // Use Mojang official mappings (matches our codebase naming)
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.property('fabric_loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_version')}"
    // Fabric API inside the jar (SMH plan 69; the user, 2026-11-03: "Just drag and drop to the folder. And start
    // SMH."): one jar into mods is enough. Fabric Loader uses this copy only when no newer Fabric API is there.
    include "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_version')}"

    // API module
    implementation project(':api')

    // Gson
    compileOnly 'com.google.code.gson:gson:2.11.0'
}

loom {
    accessWidenerPath = file("src/main/resources/mineagent.accesswidener")

    mods {
        mineagent {
            sourceSet sourceSets.main
        }
        "mineagent-gametest" {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        // ./gradlew :fabric:runGametest: the scenes in src/gametest on a headless server; it exits with the number
        // of scenes that failed, and writes build/gametest/junit.xml.
        gametest {
            server()
            name "Game Test"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/gametest/junit.xml"
            runDir "build/gametest"
        }
        // ./gradlew :fabric:runBenchmark (SMH plan 70): a real world, a fresh companion on its own, sprinted through
        // -PbenchmarkTicks (72,000: three days); the report in build/benchmark/report.json. Only by hand
        // (.github/workflows/benchmark.yml); the world's seed and rules are in build/benchmark/server.properties.
        benchmark {
            server()
            name "Benchmark"
            source sourceSets.gametest
            vmArg "-Dmineagent.benchmark=${project.findProperty('benchmarkTicks') ?: '72000'}"
            vmArg "-Dmineagent.benchmark.report=${project.buildDir}/benchmark/report.json"
            // Its work traced (what it is stuck on, and why), for the progress posted as it runs.
            vmArg "-Dmineagent.traceWork=true"
            programArgs "nogui"
            runDir "build/benchmark"
        }
        client {
            client()
            setConfigName("Fabric Client")
        }
        server {
            server()
            setConfigName("Fabric Server")
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// SMH plan 70: every compile error of the AltoClef port at once, while it is ported (-Palto).
if (project.hasProperty('alto')) {
    tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '5000'] }
}
