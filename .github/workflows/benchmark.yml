# The benchmark (SMH plan 70): a fresh companion living on its own on a real world, sprinted through three in-game days,
# checked against the minimum (a hut, a furnace, a crafting table, some food, some fuel, stone tools or better).
# By hand only: Actions > Benchmark > Run workflow (once this file is on the default branch), or a push to smh-companion
# whose commit message says [benchmark]. Its progress is posted each minute to a check run on the commit, "Benchmark
# progress" (a job's own log can be read only once it has ended).
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      days:
        description: In-game days to run
        default: "3"
      seed:
        description: The world's seed
        default: "smh-benchmark-1"
      switches:
        description: Switches turned on over the config (comma separated, as altoTasks,altoLife)
        default: ""
  push:
    branches: [smh-companion]

jobs:
  benchmark:
    # Three worlds at once (its owner: "consistently achieve minimum met by day 3. At least 3 times in a row"): the
    # same code on three seeds, each its own job and its own progress check run.
    name: Three days on its own (${{ matrix.seed }}${{ matrix.way != 'as set' && format(', {0}', matrix.way) || '' }})
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[benchmark]')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(github.event.inputs.seed && format('["{0}"]', github.event.inputs.seed) || '["smh-benchmark-1","smh-benchmark-2","smh-benchmark-3"]') }}
        # [compare]: each world twice, as the config has it and with the one agent ([compare-alto]: AltoClef's switches).
        way: ${{ fromJSON(contains(github.event.head_commit.message, '[compare-alto]') && '["as set","altoclef"]' || contains(github.event.head_commit.message, '[compare]') && '["as set","agent"]' || '["as set"]') }}
    permissions:
      contents: read
      checks: write
    env:
      DAYS: ${{ github.event.inputs.days || '3' }}
      SEED: ${{ matrix.seed }}
      # A [benchmark] push whose message also says [alto] runs AltoClef's tasks and life; [alto+] its survival chains too.
      SWITCHES: ${{ matrix.way == 'altoclef' && 'altoTasks,altoLife,altoSurvival' || matrix.way == 'agent' && 'oneAgent' || github.event.inputs.switches || (contains(github.event.head_commit.message, '[agent]') && 'oneAgent' || contains(github.event.head_commit.message, '[alto+]') && 'altoTasks,altoLife,altoSurvival' || contains(github.event.head_commit.message, '[alto]') && 'altoTasks,altoLife' || '') }}
      WAY: ${{ matrix.way }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: The world
        run: |
          mkdir -p fabric/build/benchmark
          echo "eula=true" > fabric/build/benchmark/eula.txt
          cat > fabric/build/benchmark/server.properties <<PROPS
          level-seed=${SEED}
          gamemode=survival
          difficulty=normal
          spawn-protection=0
          online-mode=false
          view-distance=10
          simulation-distance=10
          max-tick-time=-1
          spawn-monsters=true
          spawn-animals=true
          generate-structures=true
          PROPS
      - name: Run it
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          touch benchmark.log
          python3 .github/benchmark_progress.py benchmark.log &
          status=0
          ./gradlew --no-daemon :fabric:runBenchmark -PbenchmarkTicks=$(( DAYS * 24000 )) "-PbenchmarkSwitches=${SWITCHES}" > benchmark.log 2>&1 || status=$?
          sleep 70 # the last progress posted, and the check run closed
          grep "\[BENCH\]" benchmark.log | cut -c 1-600 | tail -400 || true
          exit $status
      - name: Keep the report and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ matrix.seed }}-${{ matrix.way == 'altoclef' && 'altoclef' || matrix.way == 'agent' && 'agent' || 'as-set' }}
          path: |
            fabric/build/benchmark/report.json
            benchmark.log
            fabric/build/benchmark/logs/latest.log
