name: AltoClef port compile

# SMH plan 70: the engine's port of AltoClef's tasks (engine/.../alto) compiled with -Palto while it is left out of the
# normal build; every error listed once at the end of the job log (.github/alto/errors.py).
on:
  push:
    branches: [smh-companion]
    paths: ['engine/src/main/java/com/mineagent/engine/alto/**', '.github/workflows/alto-compile.yml', '.github/alto/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile with the port
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava -Palto > build.log 2>&1 || true
          python3 .github/alto/errors.py build.log
          grep -q "BUILD SUCCESSFUL" build.log
