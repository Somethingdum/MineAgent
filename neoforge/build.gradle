plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.28-beta'
}

group = rootProject.group
version = rootProject.version

base {
    // NeoForge is released beside Fabric as an explicitly experimental asset.
    archivesName = 'mineagent-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
}

// Compile every shared module into the distributable mod. A normal Gradle
// project dependency is only present on the development classpath; it is not
// embedded in the mod JAR and previously left all API classes missing at
// runtime.
sourceSets {
    main {
        java {
            srcDir project(':api').file('src/main/java')
            srcDir project(':engine').file('src/main/java')
            // The complete visual client is loader-neutral vanilla code.
            // Both loader builds include this source set, but the standalone
            // engine module and dedicated-server sources do not.
            srcDir project(':engine').file('src/client/java')
            srcDir project(':tools').file('src/main/java')
        }
        resources {
            srcDir project(':engine').file('src/main/resources')
            srcDir project(':engine').file('src/client/resources')
            srcDir project(':tools').file('src/main/resources')
        }
    }
}

// A smoke mod (SMH plan 71, step 0.6): the companion spawned on a real NeoForge server and the player list checked
// (./gradlew :neoforge:runSmoke). Its own source set, so it is never in the jar.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
neoForge.addModdingDependenciesTo(sourceSets.smoke)

dependencies {
    smokeImplementation project(':api')
    implementation project(':api')
    // The ported SecondBrainEngine's annotations (javax.annotation: Nullable, Nonnegative); the game ships them at run time.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

// The smoke run's server: the EULA accepted, offline (the owner is a stand-in), a fresh small world each time.
tasks.register('smokeServerFiles') {
    doLast {
        def dir = project.file('run-smoke')
        project.delete(new File(dir, 'world'))
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
        new File(dir, 'server.properties').text = 'online-mode=false\nlevel-seed=smh-smoke\nspawn-protection=0\n' +
                'view-distance=4\nsimulation-distance=4\nmax-tick-time=-1\n'
    }
}

neoForge {
    version = project.property('neoforge_version')

    // ModDev does not infer the active development mod merely from
    // neoforge.mods.toml. Without this declaration resources were visible in
    // the Mods list, but the class directory was not scanned as MineAgent:
    // @Mod, key mappings, commands, networking, and engine setup never ran.
    mods {
        mineagent {
            sourceSet sourceSets.main
        }
        mineagent_smoke {
            sourceSet sourceSets.smoke
        }
    }

    runs {
        client {
            client()
            mods.set([neoForge.mods.mineagent])
        }
        server {
            server()
            mods.set([neoForge.mods.mineagent])
        }
        // ./gradlew :neoforge:runSmoke: a fresh world, the companion spawned for a stand-in owner, the player list
        // checked; the server exits 0 when it held (MineAgentSmoke).
        smoke {
            server()
            sourceSet = sourceSets.smoke
            mods.set([neoForge.mods.mineagent, neoForge.mods.mineagent_smoke])
            gameDirectory = project.file('run-smoke')
            systemProperty 'mineagent.smoke', 'true'
            programArgument '--nogui'
            taskBefore tasks.named('smokeServerFiles')
        }
    }
}

processResources {
    inputs.property 'version', project.version
    from(project(':tools').sourceSets.main.resources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/neoforge.mods.toml') {
        // NeoForge ModDev does not expand arbitrary Gradle placeholders by
        // default; without this, the installed mod reports "${version}".
        expand version: project.version
    }
}
